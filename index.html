  <!-- 加载提示（资源包解析期间显示） -->
  <div id="__bootTip">
    <div class="__bt-title">Stickman Battle</div>
    <div class="__bt-sub">正在加载离线资源…</div>
    <div class="__bt-bar"><i></i></div>
    <div class="__bt-hint" id="__btHint">首次打开需要几秒，请稍候</div>

    <!-- 下载源选择：GitHub Pages / Netlify -->
    <div class="__bt-src" id="__btSrc" hidden>
      <span class="__bt-src-cap">下载源</span>
      <button type="button" class="__bt-src-btn" data-src="gh">GitHub Pages</button>
      <button type="button" class="__bt-src-btn" data-src="netlify">Netlify</button>
    </div>
    <div class="__bt-src-tip" id="__btSrcTip" hidden>选中后自动重新加载</div>

  <style>
    #__bootTip{
      position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;
      background:radial-gradient(900px 500px at 50% 30%,#1e5bc6 0%,#0d2a63 55%,#06122b 100%);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      color:#fff;transition:opacity .35s ease;
    }
    #__bootTip.__hide{opacity:0;pointer-events:none}
    .__bt-title{font-size:30px;font-weight:800;letter-spacing:1px}
    .__bt-sub{font-size:14px;color:#a9c0e8}
    .__bt-bar{width:220px;height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
    .__bt-bar i{display:block;height:100%;width:28%;border-radius:99px;
      background:linear-gradient(90deg,#ffb347,#ff6a3d);animation:__btslide 1.15s ease-in-out infinite}
    @keyframes __btslide{0%{transform:translateX(-100%)}100%{transform:translateX(420%)}}
    .__bt-hint{font-size:12px;color:#7e97c4}
    .__bt-src{display:flex;align-items:center;gap:6px;margin-top:10px;padding:5px 6px;
      border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(150,190,255,.22);
      transition:border-color .25s,box-shadow .25s}
    .__bt-src[hidden]{display:none}
    .__bt-src-cap{font-size:11px;color:#8fa8d4;padding:0 2px 0 6px;letter-spacing:.5px;white-space:nowrap}
    .__bt-src-btn{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;font:inherit;
      flex:0 0 104px;text-align:center;font-size:12px;font-weight:700;line-height:1;color:#c6d8f6;
      background:rgba(255,255,255,.06);padding:9px 0;border-radius:99px;
      transition:background .18s,color .18s}
    .__bt-src-btn:active{transform:scale(.97)}
    .__bt-src-btn.__on{color:#23140a;background:linear-gradient(90deg,#ffb347,#ff6a3d);
      box-shadow:0 2px 10px rgba(255,120,60,.35)}
    .__bt-src-tip{font-size:11px;color:#6d86b3;margin-top:2px}
    .__bt-src-tip[hidden]{display:none}
    .__bt-src.__beat{border-color:rgba(255,170,90,.6);animation:__btpulse 1.5s ease-in-out infinite}
    @keyframes __btpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,150,70,0)}50%{box-shadow:0 0 0 5px rgba(255,150,70,.13)}}
    #__bootErr{
      position:fixed;inset:0;z-index:1000000;display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;
      background:#08152f;color:#ffd7d7;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    }
    #__bootErr h3{font-size:20px;color:#ff8a8a}
    #__bootErr p{font-size:14px;line-height:1.8;color:#c9d8f5;max-width:620px}
    #__bootErr code{background:rgba(0,0,0,.4);padding:2px 7px;border-radius:5px;color:#9fe0ff}
  </style>

  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

  <!-- ① 内联资源包（JSON / 图片 / 音频）-->
  <!-- 单个包下载失败时原地重试，最多 3 次；避免一次握手抖动就整页报废 -->
  <script>
    /* 下载源选择：GitHub Pages / Netlify
       ------------------------------------------------------------------
       生效优先级：?src=gh|netlify|local  >  localStorage 记忆  >  站点默认
       站点默认：GitHub Pages 上默认走 Netlify（避开握手抖动）；
                 其它站点走自身相对路径。
       当前站点就是所选源时用相对路径，不产生跨域请求。
       调试：?src=local 强制本站，?src=gh / ?src=netlify 强制指定源（仅本次，不写记忆）。 */
    window.__SRC = (function () {
      var SRC = {
        gh: 'https://tssuu57.github.io/stickmanbattle/',
        netlify: 'https://stickmanbattle-cn.netlify.app/'
      };
      var KEY = 'sb_src_v1';
      var NAME = { gh: 'GitHub Pages', netlify: 'Netlify' };
      var host = location.hostname || '';
      var here = /(^|\.)github\.io$/i.test(host) ? 'gh'
               : /(^|\.)netlify\.app$/i.test(host) ? 'netlify' : '';
      var m = /[?&]src=(gh|netlify|local)(?:&|$)/.exec(location.search || '');
      /* 兼容旧调试参数 */
      if (!m && /[?&]cdn=0(?:&|$)/.test(location.search || '')) m = ['', 'local'];
      if (!m && /[?&]cdn=1(?:&|$)/.test(location.search || '')) m = ['', 'netlify'];
      var saved = '';
      try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}
      var pick = m ? m[1] : saved;
      /* 站点默认：GitHub Pages 上默认走 Netlify（GitHub 握手不稳）；其它站点走自身 */
      if (pick !== 'gh' && pick !== 'netlify' && pick !== 'local') {
        pick = (here === 'gh') ? 'netlify' : (here || 'local');
      }

      var api = {
        srcs: SRC,
        here: here,                          // 当前站点所属源（本地为空）
        pick: pick,                          // gh | netlify | local
        name: NAME,
        host: (pick === 'local' || pick === here) ? '' : (SRC[pick] || ''),
        /* 记录选择并重载，让新源从下一个请求开始生效 */
        use: function (v) {
          if (v !== 'gh' && v !== 'netlify') return;
          try { localStorage.setItem(KEY, v); } catch (e) {}
          var q = (location.search || '').replace(/^\?/, '').split('&')
            .filter(function (p) { return p && !/^src=/.test(p); });
          try {
            location.replace(location.pathname + (q.length ? '?' + q.join('&') : ''));
          } catch (e) { location.reload(); }
        }
      };

      /* ---- 加载页上的切换器 ---- */
      var box = document.getElementById('__btSrc');
      var tip = document.getElementById('__btSrcTip');
      var hint = document.getElementById('__btHint');
      if (box) {
        var shown = (pick === 'local') ? here : pick;   // 高亮"本次实际生效"的源
        var btns = box.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
          (function (b) {
            if (b.getAttribute('data-src') === shown) b.className = '__bt-src-btn __on';
            b.onclick = function () {
              var v = b.getAttribute('data-src');
              if (v === shown) { if (tip) tip.textContent = '当前用的就是这个源'; return; }
              if (tip) tip.textContent = '正在切换到 ' + NAME[v] + '…';
              b.className = '__bt-src-btn __on';
              api.use(v);
            };
          })(btns[i]);
        }
        box.hidden = false;
        if (tip) {
          tip.hidden = false;
          tip.textContent = shown ? ('当前：' + NAME[shown] + '，点另一个可切换') : '选中后自动重新加载';
        }
        /* 2.6 秒还没进游戏 → 把切换器点亮，提示可以换源 */
        setTimeout(function () {
          var b2 = document.getElementById('__btSrc');
          if (!b2) return;
          b2.className = '__bt-src __beat';
          if (hint) hint.textContent = '加载偏慢？可以换个下载源试试';
        }, 2600);
      }
      return api;
    })();
    window.__ASSET_HOST = window.__SRC.host;
  </script>
  <script src="pack/__manifest.js"></script>
  <script>
    (function () {
      var list = window.__PK_MANIFEST || ['pack-00.js', 'pack-01.js'];
      var tries = {}, MAX = 3;

      function write(name, n) {
        // 前 MAX 次走 CDN，最后一次重试回源到 GitHub 自身
        var base = (n >= MAX ? '' : (window.__ASSET_HOST || ''));
        var src = base + 'pack/' + name + (n ? '?r=' + n : '');
        var err = ' onerror="window.__PK_RETRY(\'' + name + '\')"';
        if (document.readyState === 'loading') {
          document.write('<script src="' + src + '"' + err + '><\/script>');
        } else {
          var s = document.createElement('script');
          s.src = src;
          s.onerror = function () { window.__PK_RETRY(name); };
          document.head.appendChild(s);
        }
      }

      window.__PK_RETRY = function (name) {
        tries[name] = (tries[name] || 0) + 1;
        if (tries[name] > MAX) {
          console.warn('[PK] 资源包 ' + name + ' 重试 ' + MAX + ' 次仍失败');
          return;
        }
        console.warn('[PK] 重试资源包 ' + name + ' (' + tries[name] + '/' + MAX + ')');
        write(name, tries[name]);
      };

      for (var i = 0; i < list.length; i++) write(list[i], 0);
    })();
  </script>

  <!-- ② 请求拦截层：让引擎从内存读取资源 -->
  <script>
    /* 在线模式：iload.png 改由实体文件加载（内联纹理在部分浏览器下会失效） */
    if (location.protocol !== 'file:' && window.__PK && window.__PK.files) {
      delete window.__PK.files['iload.png'];
    }
  </script>

  <script src="__shim.js"></script>
  <script>
    (function(){
      var tip = document.getElementById('__bootTip');
      if (tip) {
        tip.classList.add('__hide');
        setTimeout(function(){ if (tip.parentNode) tip.parentNode.removeChild(tip); }, 400);
      }
      if (!window.__PK || !window.__PK.files) {
        var e = document.createElement('div');
        e.id = '__bootErr';
        e.style.display = 'flex';
        e.innerHTML = '<h3>资源包没有加载成功</h3>' +
          '<p>请确认 <code>pack</code> 文件夹里的 <code>pack-00.js ~ pack-04.js</code> 与 ' +
          '<code>开始游戏.html</code> 在同一个目录下，不要单独移动 HTML 文件。</p>';
        document.body.appendChild(e);
      }
    })();
  </script>

  <script src="main.reopenwebgl1.js" charset="utf-8" onerror="window.__gameStartup.fail('启动脚本下载','main.reopenwebgl1.js',null,{autoRecover:true})"></script>

  <script type="text/javascript">
  (function () {
    if (typeof VConsole !== 'undefined') {
      window.vConsole = new VConsole();
    }

    var settings = window._CCSettings;
    if (!settings) {
      window.__gameStartup.fail('配置读取', 'window._CCSettings 不存在。', null, {autoRecover:true});
      return;
    }
    var debug = settings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb, attempt) {
      attempt = attempt || 0;
      function scriptLoaded () {
        document.body.removeChild(domScript);
        domScript.removeEventListener('load', scriptLoaded, false);
        cb && cb();
      }
      var domScript = document.createElement('script');
      domScript.async = true;
      // 前两次走 CDN（GitHub Pages 环境下生效），最后一次回源
      var host = (attempt >= 2 ? '' : (window.__ASSET_HOST || ''));
      domScript.src = host + moduleName + '?v=offline' + (attempt ? '&r=' + attempt : '');
      domScript.addEventListener('error', function () {
        if (attempt < 2) {
          console.warn('[BOOT] 重试引擎脚本 ' + moduleName + ' (' + (attempt + 1) + '/2)');
          setTimeout(function () { loadScript(moduleName, cb, attempt + 1); }, 500);
          return;
        }
        window.__gameStartup.fail('引擎脚本下载', moduleName, null, {autoRecover:true});
      });
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.reopenwebgl1.js', function () {
      if (window.__installTouchBridge) window.__installTouchBridge();
      if (window.CC_PHYSICS_BUILTIN || window.CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      } else {
        if (typeof window.boot === 'function') window.boot();
        else window.__gameStartup.fail('启动函数', 'window.boot 不存在。', null, {autoRecover:true});
      }
    });
  })();
  </script>

  <!-- 加载过慢提示（不遮挡游戏） -->
  <div id="__slowTip">
    <span id="__slowTxt">加载较慢…</span>
    <span class="__st-btns">
      <button id="__slowAlt">换个源</button>
      <button id="__slowRetry">重新加载</button>
    </span>
  </div>
  <style>
    #__slowTip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:999999;
      display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;
      max-width:calc(100vw - 16px);box-sizing:border-box;
      padding:8px 10px 8px 14px;border-radius:22px;
      background:rgba(8,18,36,.92);border:1px solid rgba(120,170,255,.4);
      color:#cfe0fa;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    #__slowTip.__on{display:flex}
    #__slowTxt{white-space:nowrap}
    .__st-btns{display:flex;gap:8px}
    #__slowTip button{padding:5px 12px;border-radius:99px;cursor:pointer;font-size:12px;
      font-weight:700;border:1px solid rgba(140,190,255,.45);white-space:nowrap;
      background:rgba(47,125,255,.85);color:#fff}
  </style>
  <script>
    (function () {
      var tip = document.getElementById('__slowTip');
      var txt = document.getElementById('__slowTxt');
      var alt = document.getElementById('__slowAlt');
      document.getElementById('__slowRetry').onclick = function () { location.reload(); };

      /* "换个源"直接在 Netlify 与 GitHub Pages 之间对调，不需要回到选择页 */
      var cur = window.__SRC ? window.__SRC.pick : '';
      if (cur === 'local' && window.__SRC && window.__SRC.here) cur = window.__SRC.here;
      var other = cur === 'gh' ? 'netlify' : 'gh';
      if (!cur || !window.__SRC || !window.__SRC.srcs[other]) {
        alt.style.display = 'none';
      } else {
        alt.textContent = '换 ' + window.__SRC.name[other];
        alt.onclick = function () {
          txt.textContent = '正在切换到 ' + window.__SRC.name[other] + '…';
          window.__SRC.use(other);
        };
      }

      var t0 = Date.now();
      function inGame() {
        try {
          var d = window.cc && cc.director;
          if (d && d.getScene) {
            var s = d.getScene();
            if (s && s.name && s.name !== 'Load') return true;
          }
        } catch (e) { /* 忽略 */ }
        return false;
      }
      var iv = setInterval(function () {
        if (inGame()) { clearInterval(iv); tip.classList.remove('__on'); return; }
        var el = Date.now() - t0;
        if (el > 10000) {
          txt.textContent = el > 40000
            ? '还没加载完，换个源'
            : '加载较慢…';
          tip.classList.add('__on');
        }
      }, 800);
    })();
  </script>
