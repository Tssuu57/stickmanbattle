header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}

.back{color:var(--acc);text-decoration:none;font-size:13px}

nav{max-width:1100px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}

nav button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
nav button span{font-size:11px;color:var(--mute);margin-left:3px;font-weight:400}
main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
.intro{color:var(--mute);font-size:13px;margin:0 0 12px}
h2{font-size:15px;margin:22px 0 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.grid.map{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.c .ic{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--chip);border-radius:10px;overflow:hidden}
.c .ic img{width:46px;height:46px;object-fit:contain}
.c b{display:block;font-size:15px}
.c p{margin:2px 0 0;color:var(--mute);font-size:13px}
.c .no{font-size:11px;color:var(--mute);font-weight:400;margin-left:6px}
.pic .c{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 8px}
.pic .c img{width:96px;height:96px;object-fit:contain}
.map .c{flex-direction:column;gap:6px;padding:0;overflow:hidden}
.map .c img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--chip)}
.map .c div{padding:4px 12px 10px}
.st{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--chip);color:var(--mute);margin-top:4px}
.st.hi{color:var(--acc2)}.st.lo{color:var(--bad)}
.tag{font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--acc);color:var(--acc);margin-left:6px;font-weight:400}
.empty{color:var(--mute);padding:20px 0}
iframe{width:100%;height:calc(100vh - 130px);min-height:600px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.hide{display:none!important}
body.embed .back{display:none}
body.embed .top{padding-left:68px}
body.embed header{padding-top:4px}
</style>

var TABS=[["weapon","武器"],["passive","被动"],["item","道具"],["field","场地"],["map","地图"],["head","头像"],["log","日志"]];
if(!D.heads.length)TABS=TABS.filter(function(t){return t[0]!=="head";});
var cur="weapon";
try{ var h=(location.hash||"").slice(1); if(TABS.some(function(t){return t[0]===h;}))cur=h; else { var s=localStorage.getItem("tj.tab"); if(s)cur=s; } }catch(e){}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function img(src){return "<img loading='lazy' src='"+esc(src)+"' alt='' onerror=\"this.style.visibility='hidden'\">";}
function stat(o,kind){ if(!o||!o.n)return ""; if(kind==="n")return "<span class='st'>出现 "+o.n+" 局</span>";
  var p=Math.round(o.w/o.n*100), cls=o.n<10?"":(p>58?" hi":(p<42?" lo":""));
  return "<span class='st"+cls+"'>胜率 "+p+"% · "+o.n+" 局</span>"; }
function card(ic,name,desc,extra,key){ return "<div class='c' data-s='"+esc((name+" "+desc+" "+(key||"")).toLowerCase())+"'><div class='ic'>"+ic+"</div><div><b>"+name+"</b><p>"+esc(desc)+"</p>"+(extra||"")+"</div></div>"; }
var S={passive:{},field:{},weapon:{}};
function calc(){
  S={passive:{},field:{},weapon:{}};
  LOG.forEach(function(r){ if(!r||!r.p||r.p.length!==2)return;
    var f=r.field||"none"; (S.field[f]=S.field[f]||{n:0}).n++;
    r.p.forEach(function(p,i){
      var k=p.passive; if(k){ var o=S.passive[k]||(S.passive[k]={n:0,w:0}); o.n++; if(r.winner===i)o.w++; }
      var ws=p.weapons||{}, best=null, bs=0; for(var w in ws){ if(ws[w]>bs){bs=ws[w];best=w;} }
      if(best){ best=best.replace(/2$/,""); var q=S.weapon[best]||(S.weapon[best]={n:0,w:0}); q.n++; if(r.winner===i)q.w++; }
    });
  });
}
var R={
  weapon:function(){
    var all=D.orig.map(function(w){return card(img(w.icon),esc(w.name),"基础伤害 "+w.atk,stat(S.weapon[w.id]),w.id);});
    D.meme.forEach(function(w,i){ all.splice(Math.min(all.length,3+i*6),0,card(img(w.img),esc(w.name),w.eff,"",w.id)); });
    return "<p class='intro'>开局和局中换武器时，所有武器在同一个池子里随机抽，每一把被抽到的机会一样。</p><div class='grid'>"+all.join("")+"</div>"; },
  passive:function(){
    if(!PI)return "<div class='empty'>加载中…</div>";
    return "<p class='intro'>开局每人选一个被动（也可以随机）。胜率来自对战日志。</p><div class='grid'>"+PI.passives.filter(function(p){return p.id!=="random";}).map(function(p){return card("<span>✦</span>",esc(p.name),p.desc,stat(S.passive[p.id]),p.id);}).join("")+"</div>"; },
  item:function(){
    if(!PI)return "<div class='empty'>加载中…</div>";
    return "<p class='intro'>场上会随机掉道具，碰到就用。</p><div class='grid'>"+PI.items.map(function(it){ var ic=D.icons[it.state]?img(D.icons[it.state]):"<span>"+esc(it.emoji||"🎁")+"</span>";
      return card(ic,esc(it.name),(it.detail||it.short||""),"",it.short);}).join("")+"</div>"; },
  field:function(){
    return "<p class='intro'>每局可以带一个场地规则，两个人都受影响。</p><div class='grid'>"+D.fields.map(function(f){return card("<span>"+esc(f.emoji)+"</span>",esc(f.name)+"<span class='no'>#"+f.no+"</span>",f.desc,stat(S.field[f.id],"n"),f.id);}).join("")+"</div>"; },
  map:function(){
    return "<p class='intro'>双人对战轮流使用这些地图。</p><div class='grid map'>"+D.maps.map(function(m,i){return "<div class='c' data-s='"+esc((m.id+" "+m.theme+" 第"+(i+1)+"张").toLowerCase())+"'>"+img(m.img)+"<div><b>第 "+(i+1)+" 张 · "+esc(m.theme)+"</b></div></div>";}).join("")+"</div>"; },
  head:function(){
    return "<p class='intro'>每局开始，两边都会随机戴上一个会动的奶蛙头。</p><div class='grid pic'>"+D.heads.map(function(x){return "<div class='c' data-s='"+esc(x.name.toLowerCase())+"'>"+img(x.img)+"<b>"+esc(x.name)+"</b></div>";}).join("")+"</div>"; },
  log:function(){ return "<iframe src='battlelog.html' title='战斗日志'></iframe>"; }
};
function count(t){ if(t==="weapon")return D.meme.length+D.orig.length; if(t==="passive")return PI?PI.passives.filter(function(p){return p.id!=="random";}).length:""; if(t==="item")return PI?PI.items.length:""; if(t==="field")return D.fields.length; if(t==="map")return D.maps.length; if(t==="head")return D.heads.length; return ""; }
function nav(){ document.getElementById("tabs").innerHTML=TABS.map(function(t){var n=count(t[0]);return "<button data-t='"+t[0]+"' class='"+(t[0]===cur?"on":"")+"'>"+t[1]+(n!==""?"<span>"+n+"</span>":"")+"</button>";}).join("");
  document.querySelectorAll("#tabs button").forEach(function(b){ b.onclick=function(){ cur=b.getAttribute("data-t"); try{localStorage.setItem("tj.tab",cur);}catch(e){} history.replaceState(null,"","#"+cur); show(); }; }); }
function show(){ nav(); var m=document.getElementById("main"); m.innerHTML=R[cur](); document.getElementById("q").classList.toggle("hide",cur==="log"); filter(); }
function filter(){ var q=document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll("#main [data-s]").forEach(function(el){ el.classList.toggle("hide",!!q&&el.getAttribute("data-s").indexOf(q)<0); }); }
document.getElementById("q").oninput=filter;
show();
fetch("assets/passive_item_data.originalnamesr1.json?t="+Date.now()).then(function(r){return r.json();}).then(function(d){PI=d; if(cur==="passive"||cur==="item")show(); else nav();}).catch(function(){});
function __loadLogs(){
  var local=[];
  try{ local=JSON.parse(localStorage.getItem("stickman.battlelog.queue")||"[]")||[]; }catch(e){}
  return fetch("assets/battlelog.data.json?t="+Date.now())
    .then(function(r){ return r.ok?r.json():[]; })
    .catch(function(){ return []; })
    .then(function(hist){
      var seen={}, all=[];
      (Array.isArray(hist)?hist:[]).concat(Array.isArray(local)?local:[]).forEach(function(r){
        if(!r||typeof r!=="object")return;
        var k=[r.ts||0,r.field||"",r.winner===undefined?"":r.winner].join("|");
        if(seen[k])return; seen[k]=1; all.push(r);
      });
      all.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
      return all;
    });
}
__loadLogs().then(function(d){LOG=d; calc(); if(cur!=="log"&&cur!=="map"&&cur!=="head")show();}).catch(function(){});
